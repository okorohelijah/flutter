name: toolbardemo
description: "Demo app for the prototype of flutter/flutter#184902: Android's own text toolbar in a Flutter app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.15.0-178.0.dev

dependencies:
  flutter:
    sdk: flutter
  # What `flutter create` puts here today: Material and Cupertino widgets now
  # come from pub packages, not from the Flutter SDK.
  material_ui: ^1.1.0
  cupertino_ui: ^1.0.0

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
